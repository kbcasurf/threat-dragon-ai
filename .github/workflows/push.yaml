name: Build and push docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# for security reasons the github actions are pinned to specific SHAs
jobs:
  server_unit_tests:
    name: Server unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: td.server

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use node LTS 24.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.16'

      - name: Cache NPM dir
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            ${{ runner.os }}-

      - name: Install clean packages
        run: npm clean-install

      - name: lint
        run: npm run lint

      - name: Unit test
        run: npm run test:unit

  site_unit_tests:
    name: Site unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use node LTS 24.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.16'

      - name: Cache NPM dir
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            ${{ runner.os }}-

      - name: Install clean packages
        run: npm clean-install

      - name: lint
        run: npm run lint

      - name: Unit test
        run: npm run test:unit

  desktop_unit_tests:
    name: Desktop unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: td.vue

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use node LTS 24.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.16'

      - name: Cache NPM dir
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            ${{ runner.os }}-

      - name: Install clean packages
        run: npm clean-install

      - name: lint
        run: npm run lint:desktop

      - name: Unit test
        run: npm run test:desktop

  build_and_push:
    name: Build, scan and push image
    runs-on: ubuntu-24.04
    needs: [server_unit_tests, site_unit_tests, desktop_unit_tests]

    steps:
      # This job intentionally diverges from this repo's usual SHA-pinning
      # convention: it mirrors kbcasurf/sammwise-ai's .github/workflows/action.yml
      # step-for-step (same action versions, same absence of cache/multi-arch/
      # provenance), because that is the only configuration confirmed to
      # actually push to GHCR successfully. Every deviation tried here first
      # (SHA-pinned docker/build-push-action v7.3.0, with/without multi-arch,
      # with/without provenance:false) failed with the same
      # "unexpected status from HEAD request ... 403 Forbidden" on a new
      # package - a known, unresolved upstream issue with no documented fix
      # (see docker/build-push-action#981, #463, #1240).
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: threat-dragon-ai:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: threat-dragon-ai:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: '.github/workflows/.trivyignore'
          # The Dockerfile force-upgrades the global npm CLI (`npm i -g npm@latest`)
          # as build tooling only; it is never invoked at runtime (ENTRYPOINT runs
          # `node index.js` directly). npm's own vendored deps (tar, brace-expansion,
          # etc.) get new CVEs on their own cadence regardless of which npm version
          # is pinned, so scanning them here is noise, not real runtime risk.
          skip-dirs: '/usr/local/lib/node_modules/npm'

      - name: Push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/threat-dragon-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
